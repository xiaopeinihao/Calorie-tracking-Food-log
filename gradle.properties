org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KSP 在这套环境（Windows + 中文路径 + Kotlin 2.0.21）下会偶发内部崩溃：
#   kotlin.UninitializedPropertyAccessException: lateinit property cleanFilenames has not been initialized
# 关掉 KSP 与 Kotlin 两边的增量编译可以稳定复现率降到 0，代价是改代码后编译稍慢。
# 如果哪天想打开增量，记得保留 `tools\build.ps1 -Clean` 作为兜底。
ksp.incremental=false
kotlin.incremental=false
# AGP 8.7.3 官方只测到 compileSdk 35，这里显式声明支持 36（Android 16）
android.suppressUnsupportedCompileSdk=36
# 工程目录名含中文（E:\AI开发），AGP 默认会拒绝构建；这是官方给出的显式开关。
# 若迁移到纯 ASCII 路径，可以删掉这一行。
android.overridePathCheck=true
org.gradle.parallel=true
